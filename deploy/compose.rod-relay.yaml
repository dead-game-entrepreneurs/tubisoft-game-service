# Forced two-player 187 UDP relay. Include compose.rod.yaml before this overlay.
# Direct mode is the normal default; this does not implement adaptive fallback.
services:
  game-service:
    environment:
      TUBISOFT_ROD_RELAY_MODE: ${TUBISOFT_ROD_RELAY_MODE:-relay}
      TUBISOFT_ROD_RELAY_ADVERTISE_IP: ${TUBISOFT_ROD_RELAY_ADVERTISE_IP:-${TUBISOFT_ADVERTISE_IP}}
      TUBISOFT_ROD_RELAY_BIND_IP: ${TUBISOFT_ROD_RELAY_BIND_IP:-0.0.0.0}
      TUBISOFT_ROD_RELAY_FIRST_PORT: ${TUBISOFT_ROD_RELAY_FIRST_PORT:-30400}
      TUBISOFT_ROD_RELAY_LAST_PORT: ${TUBISOFT_ROD_RELAY_LAST_PORT:-30431}
    ports:
      - "${TUBISOFT_ROD_RELAY_FIRST_PORT:-30400}-${TUBISOFT_ROD_RELAY_LAST_PORT:-30431}:${TUBISOFT_ROD_RELAY_FIRST_PORT:-30400}-${TUBISOFT_ROD_RELAY_LAST_PORT:-30431}/udp"

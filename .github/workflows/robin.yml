name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs use a maintainer's /robin comment so their code never receives secrets.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No checkout or execution of PR code. Robin reads its snapshot through GitHub.
      - name: Review pull request
        uses: antongulin/robin@808e18045c93f80f917a41be8fa3f80fa03d70a0 # v2.13.3
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          min-command-permission: write
          agent-mode: auto
          agent-max-turns: '12'
          max-output-tokens: '16000'
          max-comments: '10'
          request-changes: 'false'
          fail-on-high: 'false'

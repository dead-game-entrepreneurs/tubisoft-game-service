name: Test and audit beta
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python tools/publication_audit.py --git
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f compose.yaml -f deploy/compose.gr2.yaml --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build
      - name: Start the actual Compose service
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.yaml -f deploy/compose.gr2.yaml --project-name tubisoft-ci --env-file .env.example)
          trap 'docker rm -f tubisoft-ci-smoke >/dev/null 2>&1 || true; "${compose[@]}" down --volumes' EXIT
          "${compose[@]}" run --no-deps -d --name tubisoft-ci-smoke game-service
          docker exec -i tubisoft-ci-smoke python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2) as response:
                      assert response.read() == b'ok\n'
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with urllib.request.urlopen('http://127.0.0.1:8080/gsinit.php?dp=XIIIPS2US', timeout=2) as response:
              assert b'192.0.2.10' in response.read()
          with urllib.request.urlopen('http://127.0.0.1:8080/gsinit.php?dp=GHOSTRECON2PS2', timeout=2) as response:
              body = response.read()
              assert body.startswith(b'[Servers]\r\n')
              assert b'RouterPort0=30010\r\n' in body
          print('Compose startup and bootstrap passed.')
          PY

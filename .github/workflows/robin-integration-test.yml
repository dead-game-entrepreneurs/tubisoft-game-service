# Temporary installation smoke test. Removed after the requested review completes.
name: Robin installation test

on:
  pull_request:
    types: [opened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review-existing-pr:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/add-robin-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download the pinned Robin bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            'repos/antongulin/robin/contents/dist/index.js?ref=808e18045c93f80f917a41be8fa3f80fa03d70a0' \
            > "$RUNNER_TEMP/robin-pinned.js"
      - name: Review PR 5 with the configured provider
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync, spawnSync} = require('node:child_process');
          // Reproduce Robin's supported pull_request event for the explicitly requested PR.
          // No PR code is checked out or executed; only the pinned reviewer bundle runs.
          const pr = JSON.parse(execFileSync('gh', ['api',
            'repos/princebyyourlogic/tubisoft-game-service/pulls/5'], {encoding: 'utf8'}));
          if (pr.state !== 'open') throw new Error('PR 5 is no longer open');
          const eventPath = path.join(process.env.RUNNER_TEMP, 'robin-pr5-event.json');
          fs.writeFileSync(eventPath, JSON.stringify({action: 'opened', number: 5, pull_request: pr}));
          const result = spawnSync(process.execPath,
            [path.join(process.env.RUNNER_TEMP, 'robin-pinned.js')], {
              stdio: 'inherit',
              env: {...process.env,
                GITHUB_EVENT_NAME: 'pull_request',
                GITHUB_EVENT_PATH: eventPath,
                'INPUT_GITHUB-TOKEN': process.env.GH_TOKEN,
                'INPUT_LLM-API-KEY': process.env.LLM_API_KEY,
                'INPUT_LLM-BASE-URL': process.env.LLM_BASE_URL,
                INPUT_MODEL: process.env.LLM_MODEL,
                'INPUT_AGENT-MODE': 'auto',
                'INPUT_AGENT-MAX-TURNS': '12',
                'INPUT_MAX-OUTPUT-TOKENS': '16000',
                'INPUT_MAX-COMMENTS': '10',
                'INPUT_REQUEST-CHANGES': 'false',
                'INPUT_FAIL-ON-HIGH': 'false'
              }
            });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS
